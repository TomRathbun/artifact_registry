[project]
name = "artifact_registry"
version = "0.1.9"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic[email]",
    "python-jose[cryptography]",
    "argon2-cffi",
    "python-multipart",
    "pydantic-settings>=2.12.0",
    "python-dotenv",
    "alembic>=1.17.1",
    "requests>=2.32.5",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "deep-translator>=1.11.4",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio"
]

[tool.uv]
# No more deprecated tool.uv.dev-dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
